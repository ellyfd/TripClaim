# 部署產品介紹頁到 GitHub Pages（https://ellyfd.github.io/TripClaim/）
#
# 觸發時機：
#   - 手動 push 到 main（site/ 或截圖有變動時）
#   - 手動觸發（workflow_dispatch）
#   - auto-test-merge.yml 合併後的部署走它自己的 deploy job
#     （GITHUB_TOKEN 的合併不會觸發這裡的 push 事件）
#
# 首次使用前，需在 Settings → Pages → Source 選「GitHub Actions」。

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
