# 部署產品介紹頁到 GitHub Pages（https://ellyfd.github.io/TripClaim/）
#
# 觸發時機：
#   - 手動 push 到 main（site/ 或截圖有變動時）
#   - 手動觸發（workflow_dispatch）
#   - Auto test & merge 完成後（workflow_run）：GITHUB_TOKEN 的合併
#     不會觸發 push 事件，但 workflow_run 會照常觸發，
#     且以 main 的身分執行，滿足 github-pages environment 的
#     「僅限 main」保護規則。
#
# 首次使用前，需在 Settings → Pages → Source 選「GitHub Actions」。

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Auto test & merge"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run 觸發時，只在 Auto test & merge 成功（＝已合併）後部署
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
