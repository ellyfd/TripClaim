# 自架部署：把 app 部署到自己的 Cloudflare 帳號（不走 GPT site）。
#
# 需要的 repo 設定（Settings → Secrets and variables → Actions）：
#   Secrets：
#     - CLOUDFLARE_API_TOKEN   （權限：Workers Scripts:Edit、D1:Edit、
#                                Workers R2 Storage:Edit）
#     - CLOUDFLARE_ACCOUNT_ID
#   Variables：
#     - TRIPCLAIM_D1_DATABASE_ID      （wrangler d1 create 回傳的 id）
#     - TRIPCLAIM_ACCESS_TEAM_DOMAIN  （例：your-team.cloudflareaccess.com）
#     - TRIPCLAIM_ACCESS_AUD          （Access 應用程式的 AUD tag）
#     - CLOUDFLARE_DEPLOY_ENABLED     （設成 true 才會在 push main 時自動部署）
#     - 選填：TRIPCLAIM_WORKER_NAME、TRIPCLAIM_D1_DATABASE_NAME、
#             TRIPCLAIM_R2_BUCKET_NAME
#
# 觸發時機：
#   - push 到 main 且 CLOUDFLARE_DEPLOY_ENABLED=true
#   - 手動觸發（workflow_dispatch）
#
# 完整設定步驟見 docs/deploy-cloudflare.md。

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Apply D1 migrations & deploy Worker
        run: node scripts/deploy-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRIPCLAIM_WORKER_NAME: ${{ vars.TRIPCLAIM_WORKER_NAME }}
          TRIPCLAIM_D1_DATABASE_NAME: ${{ vars.TRIPCLAIM_D1_DATABASE_NAME }}
          TRIPCLAIM_D1_DATABASE_ID: ${{ vars.TRIPCLAIM_D1_DATABASE_ID }}
          TRIPCLAIM_R2_BUCKET_NAME: ${{ vars.TRIPCLAIM_R2_BUCKET_NAME }}
          TRIPCLAIM_ACCESS_TEAM_DOMAIN: ${{ vars.TRIPCLAIM_ACCESS_TEAM_DOMAIN }}
          TRIPCLAIM_ACCESS_AUD: ${{ vars.TRIPCLAIM_ACCESS_AUD }}
